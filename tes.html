<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend System Logs</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-body: #0a0d14;
            --bg-card: #121824;
            --bg-card-hover: #192233;
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --border-color: #1e293b;
            
            --accent-red: #f43f5e;
            --accent-red-bg: rgba(244, 63, 94, 0.1);
            --accent-blue: #3b82f6;
            --accent-blue-bg: rgba(59, 130, 246, 0.1);
            --accent-cyan: #06b6d4;
            
            --font-code: 'JetBrains Mono', monospace;
            --font-sans: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-sans);
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 24px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-title i {
            font-size: 1.5rem;
            color: var(--accent-red);
        }

        .header-title h1 {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .system-status {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(244, 63, 94, 0.12);
            border: 1px solid rgba(244, 63, 94, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            color: var(--accent-red);
            font-weight: 600;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-red);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-red);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* SEARCH BAR */
        .controls-bar {
            display: flex;
            gap: 12px;
        }

        .search-box {
            flex: 1;
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px 10px 40px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.88rem;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--accent-blue);
        }

        /* TABLE */
        .table-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.88rem;
        }

        th {
            background: rgba(18, 24, 36, 0.8);
            color: var(--text-muted);
            font-weight: 600;
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }

        td {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        tr.log-row {
            cursor: pointer;
            transition: background 0.15s ease;
        }

        tr.log-row:hover {
            background-color: var(--bg-card-hover);
        }

        /* COMBINED BADGE CONTAINER */
        .badge-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: flex-start;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 0.72rem;
            font-weight: 700;
            font-family: var(--font-code);
        }

        .badge-status-500 {
            background: var(--accent-red-bg);
            color: var(--accent-red);
            border: 1px solid rgba(244, 63, 94, 0.3);
        }

        .badge-method-get {
            background: var(--accent-blue-bg);
            color: var(--accent-blue);
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .code-text {
            font-family: var(--font-code);
            font-size: 0.82rem;
        }

        .path-text {
            color: var(--accent-cyan);
        }

        .time-text {
            color: var(--text-muted);
            white-space: nowrap;
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
        }

        .modal-overlay.show { display: flex; }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 750px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .modal-header {
            padding: 18px 22px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(18, 24, 36, 0.5);
        }

        .modal-title {
            font-size: 1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
        }
        .modal-close:hover { color: var(--text-main); }

        .modal-body {
            padding: 22px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            background: var(--bg-body);
            padding: 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .info-label {
            font-size: 0.72rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }

        .info-value {
            font-size: 0.88rem;
            font-weight: 600;
        }

        .stack-trace-box {
            background: #07090e;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
        }

        .stack-trace-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        pre.stack-trace {
            font-family: var(--font-code);
            font-size: 0.78rem;
            color: #f87171;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.5;
            max-height: 250px;
            overflow-y: auto;
        }

        .btn-copy {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-copy:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <div class="header-title">
                <i class="fa-solid fa-terminal"></i>
                <h1>Backend Error Logs</h1>
            </div>
            <div class="system-status">
                <div class="status-dot"></div>
                <span>Server Alert (500 Error Detected)</span>
            </div>
        </div>

        <!-- CONTROLS -->
        <div class="controls-bar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Cari pesan error..." onkeyup="filterLogs()">
            </div>
        </div>

        <!-- LOG TABLE -->
        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th style="width: 120px;">Code & Method</th>
                        <th>Error Message</th>
                        <th style="width: 180px;">Timestamp</th>
                    </tr>
                </thead>
                <tbody id="logTableBody">
                    <!-- Dynamic Data Injected via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- MODAL DETAIL -->
    <div class="modal-overlay" id="logModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">
                    <i class="fa-solid fa-bug" style="color: var(--accent-red);"></i>
                    <span>Detail Error Record</span>
                </div>
                <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                
                <div class="info-grid">
                    <div class="info-item">
                        <span class="info-label">Status Code</span>
                        <span class="info-value"><span class="badge badge-status-500" id="mStatus">500</span></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Method</span>
                        <span class="info-value"><span class="badge badge-method-get" id="mMethod">GET</span></span>
                    </div>
                    <div class="info-item" style="grid-column: span 2;">
                        <span class="info-label">Path Route</span>
                        <span class="info-value code-text path-text" id="mPath">/t/dashboard/7443752808</span>
                    </div>
                    <div class="info-item" style="grid-column: span 2;">
                        <span class="info-label">Created At</span>
                        <span class="info-value code-text time-text" id="mCreated">2026-10-12 16:57:20</span>
                    </div>
                </div>

                <div>
                    <span class="info-label" style="display:block; margin-bottom: 6px;">Error Message</span>
                    <div class="info-value code-text" id="mMessage" style="color: var(--accent-red); font-size: 0.95rem;">
                        next is not a function
                    </div>
                </div>

                <div class="stack-trace-box">
                    <div class="stack-trace-header">
                        <span>RAW ERROR STACK TRACE</span>
                        <button class="btn-copy" onclick="copyTrace()"><i class="fa-regular fa-copy"></i> Copy Trace</button>
                    </div>
                    <pre class="stack-trace" id="mTrace"></pre>
                </div>

            </div>
        </div>
    </div>

    <script>
        const logData = [
            {
                createdAt: "2026-10-12T16:57:20.099Z",
                updatedAt: "2026-10-12T16:57:20.099Z",
                statusCode: 500,
                method: "GET",
                path: "/t/dashboard/7443752808",
                message: "next is not a function",
                rawError: "TypeError: next is not a function\n    at NokosController.services (/data/data/com.termux/files/home/nokos-panel/controllers/nokosController.js:64:13)\n    at telegramDash (/data/data/com.termux/files/home/nokos-panel/controllers/indexController.js:66:36)\n    at process.processTicksAndRejections (node:internal/process/task_queues:104:5)"
            }
        ];

        function formatDate(isoStr) {
            const date = new Date(isoStr);
            return date.toLocaleString('id-ID', { 
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', second: '2-digit',
                hour12: false
            });
        }

        function renderLogs(logs) {
            const tbody = document.getElementById('logTableBody');
            tbody.innerHTML = '';

            logs.forEach((log) => {
                const tr = document.createElement('tr');
                tr.className = 'log-row';
                tr.onclick = () => openModal(log);

                tr.innerHTML = `
                    <td>
                        <div class="badge-group">
                            <span class="badge badge-status-500">${log.statusCode}</span>
                            <span class="badge badge-method-get">${log.method}</span>
                        </div>
                    </td>
                    <td style="font-weight: 500; color: #f87171;">${log.message}</td>
                    <td class="time-text code-text">${formatDate(log.createdAt)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function openModal(log) {
            document.getElementById('mStatus').innerText = log.statusCode;
            document.getElementById('mMethod').innerText = log.method;
            document.getElementById('mPath').innerText = log.path;
            document.getElementById('mCreated').innerText = formatDate(log.createdAt);
            document.getElementById('mMessage').innerText = log.message;
            document.getElementById('mTrace').innerText = log.rawError;

            document.getElementById('logModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('logModal').classList.remove('show');
        }

        function copyTrace() {
            const traceText = document.getElementById('mTrace').innerText;
            navigator.clipboard.writeText(traceText).then(() => {
                alert('Raw Error Trace berhasil disalin!');
            });
        }

        function filterLogs() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = logData.filter(log => 
                log.message.toLowerCase().includes(query) ||
                log.statusCode.toString().includes(query) ||
                log.method.toLowerCase().includes(query)
            );
            renderLogs(filtered);
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderLogs(logData);
        });
    </script>
</body>
</html>
